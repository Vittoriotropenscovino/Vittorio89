# Percorso critico: creare un viaggio dall'inizio alla fine, poi cancellarlo.
# Copre la ricerca del luogo, il calendario della data (7 colonne, Conferma
# visibile anche in orizzontale) e il salvataggio con «Aggiungi Pin».
#
# Riscritto il 17/11/2026: niente piu' tocchi a coordinate fisse, solo testID
# e testi. Il campo data si attiva solo DOPO aver trovato il luogo: prima e'
# spento apposta (per questo il vecchio flusso si fermava sul «15»).
#
# ATTENZIONE: crea un viaggio VERO nei dati e alla fine lo cancella.
# Richiede rete (ricerca del luogo).
appId: com.travelsphere.app
---
- launchApp
- evalScript: "${output.orient = (typeof ORIENTATION === 'undefined' || !ORIENTATION) ? 'LANDSCAPE_LEFT' : ORIENTATION}"
- setOrientation: ${output.orient}
- extendedWaitUntil:
    visible:
      id: "stats-bar"
    timeout: 40000

- tapOn:
    id: "Add Trip"
- waitForAnimationToEnd:
    timeout: 3000

# --- Luogo: Invio sulla tastiera fa partire la ricerca ---
- tapOn:
    id: "trip-location-input"
- inputText: "Lisbona"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Lisbona, .*"
    timeout: 20000
- takeScreenshot: 02a-luogo-trovato-${output.orient}

# --- Titolo (proposto uguale al luogo: lo sostituiamo) ---
- tapOn:
    id: "trip-title"
- eraseText: 30
- inputText: "Test automatico Maestro"
# la tastiera e' aperta qui: hideKeyboard la chiude senza chiudere il modulo
- hideKeyboard

# --- Data: calendario, giorno 15 del mese corrente, Conferma ---
# Su un telefono vero in orizzontale (384 dp di altezza) il campo e' sotto: si scorre.
- scrollUntilVisible:
    element:
      id: "trip-date"
    direction: DOWN
- tapOn:
    id: "trip-date"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: "trip-date-confirm"
- takeScreenshot: 02b-calendario-${output.orient}
- tapOn: "^15$"
- tapOn:
    id: "trip-date-confirm"
- waitForAnimationToEnd:
    timeout: 2000
# 1.4.0: la data si legge nella lingua dell'app («15 nov 2026», «Nov 15, 2026»,
# «15. Nov. 2026»), non piu' «2026-11-15»
- assertVisible: "(15[ .].*20[0-9]{2})|(.* 15, 20[0-9]{2})"
- takeScreenshot: 02c-modulo-compilato-${output.orient}

# --- Salva («Aggiungi Pin») ---
- scrollUntilVisible:
    element:
      id: "trip-save"
    direction: DOWN
- tapOn:
    id: "trip-save"
- extendedWaitUntil:
    visible:
      id: "stats-bar"
    timeout: 15000
- takeScreenshot: 02d-viaggio-salvato-${output.orient}

# --- Pulizia: apre il viaggio dal menu e lo cancella ---
- tapOn:
    id: "Menu"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Test automatico Maestro"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "trip-delete"
- tapOn: "Elimina"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible: "Test automatico Maestro"
- takeScreenshot: 02e-dopo-pulizia-${output.orient}
- setOrientation: LANDSCAPE_LEFT
